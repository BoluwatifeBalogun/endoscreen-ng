{% extends "base.html" %}
{% from "partials/macros.html" import icon %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="container error-page">
  <span class="error-code">{{ code }}</span>
  <h1>{{ title }}</h1>
  <p class="muted">{{ message }}</p>
  <div class="hero-cta">
    <a class="btn btn-primary" href="{{ url_for('main.landing') }}">{{ icon('arrow-left', 18) }}Back to home</a>
    {% if g.user %}<a class="btn btn-ghost" href="{{ url_for('main.dashboard') }}">Dashboard</a>{% endif %}
  </div>
</div>
{% endblock %}
